# Built-in deterministic patterns (RE2 syntax; must also compile under Hyperscan:
# no backreferences, no lookaround). Site-specific patterns go in the file named
# by detect.patterns_file and are merged over these by name.
#
# validator: optional post-match check (luhn).
patterns:
  - name: CLASSIFICATION_MARKER
    regex: '\b(?:TOP SECRET|SECRET|CONFIDENTIAL|RESTRICTED|CUI|NOFORN|FOUO|ORCON|PROPIN|INTERNAL USE ONLY|PROPRIETARY)(?:\s*//\s*[A-Z][A-Z ,]*[A-Z])*\b'
  # Multi-word markings in any case. Single words ("confidential") stay
  # upper-case only above: in prose they are ordinary vocabulary.
  - name: CLASSIFICATION_MARKING_PHRASE
    regex: '(?i)\b(?:top secret|internal use only|for official use only|company confidential|strictly confidential|controlled unclassified information|not for (?:public )?(?:release|distribution)|attorney[- ]client privileged)\b'
  - name: EMPLOYEE_ID
    regex: '\b(?:EMP|EID|E)-?\d{5,8}\b'
  - name: PROJECT_CODENAME
    regex: '\b(?:PROJECT|OPERATION|PROGRAM)\s+[A-Z]{3,}(?:[ -][A-Z]{3,})?\b'
  - name: DOC_CONTROL_NUMBER
    regex: '\b(?:DCN|DOC|CTRL)[-#: ]?[A-Z0-9]{2,6}-\d{2,6}(?:-\d{1,6})?\b'
  - name: US_SSN
    regex: '\b\d{3}[- ]\d{2}[- ]\d{4}\b'
  # Undelimited 9-digit SSNs only with a label (bare 9-digit runs are too common).
  - name: US_SSN_LABELED
    regex: '(?i)\b(?:SSN|SSAN|social security(?: number| no\.?| #)?)\s*[:#]?\s*\d{9}\b'
  - name: EMAIL_ADDRESS
    regex: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
  - name: IP_ADDRESS
    regex: '\b(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\b'
  - name: CREDIT_CARD
    regex: '\b(?:\d[ -]?){12,18}\d\b'
    validator: luhn
  - name: PHONE_NUMBER
    regex: '(?:\+?1[ .-]?)?\(?\b\d{3}\)?[ .-]?\d{3}[ .-]\d{4}\b'
  - name: AWS_ACCESS_KEY
    regex: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
  - name: PRIVATE_KEY_BLOCK
    regex: '-----BEGIN [A-Z ]*PRIVATE KEY-----'
