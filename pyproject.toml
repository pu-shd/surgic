[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surgic"
version = "0.1.0"
description = "Air-gapped, zero-retention local AI document sanitization pipeline"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6",
  "cryptography>=42",
  "google-re2>=1.1",
  "presidio-analyzer>=2.2.355",
  "presidio-anonymizer>=2.2.355",
  "spacy>=3.7,<4",
  "pymupdf>=1.24",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "pillow>=10",
  "pytesseract>=0.3.10",
  "keyring>=25; sys_platform == 'darwin'",
]

[project.optional-dependencies]
ocr-vision = ["pyobjc-framework-Vision>=10; sys_platform == 'darwin'", "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'"]
hyperscan = ["hyperscan>=0.7"]
mlx = ["mlx-lm>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=8", "hypothesis>=6.100", "python-docx>=1.1", "pytest-timeout>=2.3"]

[project.scripts]
surgic = "surgic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
surgic = ["data/*.yaml", "data/*.tmpl", "data/*.sb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "macos: requires macOS facilities (Vision, Keychain, hdiutil, pfctl)",
  "real_model: requires a local GGUF model and llama-server",
  "requires_tool: requires an external binary (soffice, gitleaks, trufflehog, tesseract)",
]
timeout = 300
