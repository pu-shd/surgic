name: ci

on:
  push:
  pull_request:

jobs:
  docker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build -f docker/Dockerfile.test -t surgic-tests:latest .
      - name: Run tests (no network)
        run: docker run --rm --network none --tmpfs /tmp:exec surgic-tests:latest

  redteam-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install zsh and the package
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          python3.12 -m venv .venv
          .venv/bin/pip install -q -e .
      - name: Promptfoo harness with mock models (the real model runs locally, see docs/INFOSEC.md)
        run: zsh scripts/redteam.zsh --mock

  security-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Render brief to PDF
        env:
          CHROME_BIN: google-chrome
        run: zsh scripts/build_brief.zsh
      - uses: actions/upload-artifact@v4
        with:
          name: surgic-security-brief
          path: |
            docs/brief/surgic-security-brief.html
            docs/brief/surgic-security-brief.pdf
          if-no-files-found: error

  macos-native:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: brew install tesseract gitleaks trufflehog
      - name: Native tests
        env:
          SURGIC_MIN_TESTS: "275"
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -e '.[dev,ocr-vision,hyperscan]'
          zsh scripts/test.zsh
